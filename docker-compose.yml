services:
  # MySQL 8 Relational Database (Primary Source of Truth)
  db:
    image: mysql:8.0
    container_name: ai_coordination_mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: ai_coordination
      MYSQL_USER: platform_user
      MYSQL_PASSWORD: platform_pass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "platform_user", "-pplatform_pass"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Redis 7 (In-Memory Cache & Distributed Burst Rate Limiter)
  redis:
    image: redis:7-alpine
    container_name: ai_coordination_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---------------------------------------------------------------------------
  # Infrastructure Roadmap (Tracked for future approved requirements):
  # ---------------------------------------------------------------------------
  # 1. MinIO: Intended for S3-compatible object storage for file attachments
  #    and document assets once concrete storage requirements are approved.
  # minio:
  #   image: minio/minio:latest
  #   container_name: ai_coordination_minio
  #   command: server /data --console-address ":9001"
  #   ports:
  #     - "9000:9000"
  #     - "9001:9001"

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

